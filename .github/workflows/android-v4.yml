# Builds the Google Play file (signed .aab) for Volleyball V4 in the cloud.
# Run it from GitHub: Actions > "Build V4 Android (Play Store)" > Run workflow.
# It also runs by itself when anything in "volleyball/Volleyball V4" changes.
# The finished file is under the run's "Artifacts": spike-rally-aab.
#
# Signing uses four repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64  the upload key (.jks) as base64 text
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS        usually: upload
#   ANDROID_KEY_PASSWORD
name: Build V4 Android (Play Store)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'volleyball/Volleyball V4/**'
      - '.github/workflows/android-v4.yml'

jobs:
  aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'volleyball/Volleyball V4'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v4

      - name: Install Capacitor
        run: npm ci

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Unpack the upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the ANDROID_KEYSTORE_* secrets first (see the top of this file)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PW"
          } > android/keystore.properties

      - name: Build the signed App Bundle
        working-directory: 'volleyball/Volleyball V4/android'
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon bundleRelease assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Show Gradle's reason on the run summary page, not only in the step log.
            msg=$(grep -A20 -m1 'What went wrong' "$RUNNER_TEMP/gradle.log" | cut -c1-300 || true)
            [ -n "$msg" ] || msg=$(tail -25 "$RUNNER_TEMP/gradle.log" | cut -c1-300)
            msg=$(printf '%s' "$msg" | sed 's/%/%25/g' | awk 'NR>1{printf "%%0A"}{printf "%s",$0}')
            echo "::error title=Gradle build failed::$msg"
            exit 1
          fi

      - name: Remove the key from the build machine
        if: always()
        run: rm -f android/keystore.properties "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v5
        with:
          name: spike-rally-aab
          path: 'volleyball/Volleyball V4/android/app/build/outputs/bundle/release/app-release.aab'
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v5
        with:
          name: spike-rally-apk
          path: 'volleyball/Volleyball V4/android/app/build/outputs/apk/release/app-release.apk'
          if-no-files-found: error
          retention-days: 30
